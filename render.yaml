services:
  - type: web
    name: semanticcache-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_DEMO
        value: "true"
      - key: MODEL_PROVIDER
        value: gemini
      - key: CACHE_SIMILARITY_THRESHOLD
        value: "0.98"
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_PROXY_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: semanticcache-db
          property: connectionString

databases:
  - name: semanticcache-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
